<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found (404) | Jinan Sardia International Supply Chain</title>
<meta name="description" content="The page you requested could not be found.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#001f5b">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
<!-- Deliberately standalone: a 404 page must not depend on the site's scripts. -->

<section class="hero" style="min-height:100vh;display:grid;place-items:center;text-align:center">
  <div class="container">
    <span class="eyebrow" style="justify-content:center">404</span>
    <h1 style="color:#fff;margin-bottom:18px" data-i18n="err404.title">Page not found</h1>
    <p class="hero-lead" style="margin-inline:auto;text-align:center" data-i18n="err404.body">
      The link you opened is incorrect or the page has moved. Use the menu to reach our
      sectors, or head back to the home page.
    </p>

    <div class="hero-actions" style="justify-content:center;margin-top:8px">
      <a class="btn btn-primary btn-lg" href="index.html" data-i18n="err404.home">Back to home</a>
      <a class="btn btn-ghost btn-lg" href="contact.html" data-i18n="err404.contact">Contact us</a>
    </div>

    <!-- Sector shortcuts, so a lost visitor still has a way forward -->
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:52px">
      <a class="btn btn-ghost btn-sm" href="trucks.html" data-i18n="nav.trucks">Trucks</a>
      <a class="btn btn-ghost btn-sm" href="construction-machinery.html" data-i18n="nav.construction">Construction Machinery</a>
      <a class="btn btn-ghost btn-sm" href="agricultural-machinery.html" data-i18n="nav.agriculture">Agricultural Machinery</a>
      <a class="btn btn-ghost btn-sm" href="medical-supplies.html" data-i18n="nav.medical">Medical Supplies</a>
    </div>
  </div>
</section>

<script src="assets/js/i18n.js"></script>
</body>
</html>
