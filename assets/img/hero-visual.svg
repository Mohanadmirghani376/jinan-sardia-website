<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none" role="img" aria-label="Supply chain network connecting a buyer to vetted Chinese factories through Sardia">
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee6072"/>
      <stop offset="1" stop-color="#d91e36"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a9c66"/>
      <stop offset="1" stop-color="#008752"/>
    </linearGradient>
    <linearGradient id="gHub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d91e36"/>
      <stop offset="1" stop-color="#b01629"/>
    </linearGradient>
  </defs>

  <!-- connection lines -->
  <g stroke="#ffffff" stroke-opacity=".28" stroke-width="1.6" stroke-dasharray="5 6">
    <path d="M120 250C190 250 210 150 268 132"/>
    <path d="M120 250C190 250 210 250 268 250"/>
    <path d="M120 250C190 250 210 350 268 368"/>
    <path d="M392 132C430 132 440 190 452 224"/>
    <path d="M392 250h60"/>
    <path d="M392 368c38 0 44-58 56-92"/>
  </g>

  <!-- Buyer node -->
  <g>
    <circle cx="120" cy="250" r="46" fill="url(#gCard)" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.6"/>
    <path d="M98 232h44v26a4 4 0 0 1-4 4h-36a4 4 0 0 1-4-4v-26Z" fill="url(#gRed)"/>
    <path d="M98 232 120 218l22 14" stroke="#ee6072" stroke-width="3.2" stroke-linejoin="round" fill="none"/>
    <path d="M112 214.5v-8h16v8" stroke="#ffffff" stroke-opacity=".78" stroke-width="3" stroke-linecap="round"/>
    <text x="120" y="322" fill="#ffffff" fill-opacity=".74" font-family="Noto Kufi Arabic, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Buyer</text>
  </g>

  <!-- Hub: Sardia chain mark -->
  <g>
    <circle cx="330" cy="250" r="60" fill="url(#gHub)" stroke="#ffffff" stroke-opacity=".3" stroke-width="2.4"/>
    <circle cx="330" cy="250" r="72" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.4" stroke-dasharray="3 7"/>
    <g fill="none" stroke-width="5" stroke-linecap="round">
      <path d="M329.5 226.4A11.5 11.5 0 1 0 329.5 273.6" stroke="#ffffff"/>
      <path d="M330.5 273.6A11.5 11.5 0 1 1 330.5 226.4" stroke="#ffffff" stroke-opacity=".55"/>
    </g>
    <circle cx="330" cy="250" r="4.4" fill="#ffffff"/>
    <text x="330" y="352" fill="#ffffff" fill-opacity=".74" font-family="Noto Kufi Arabic, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Sardia</text>
  </g>

  <!-- Factory nodes -->
  <g>
    <g>
      <rect x="368" y="106" width="48" height="44" rx="9" fill="url(#gCard)" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5"/>
      <path d="M378 140v-13l9 6v-6l9 6v-11l9 5v13h-27Z" fill="#008752"/>
      <text x="452" y="132" fill="#ffffff" fill-opacity=".62" font-family="Noto Kufi Arabic, sans-serif" font-size="11" text-anchor="middle">Factory A</text>
    </g>
    <g>
      <rect x="368" y="228" width="48" height="44" rx="9" fill="url(#gCard)" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5"/>
      <circle cx="384" cy="244" r="5" fill="#d91e36"/>
      <circle cx="400" cy="244" r="5" fill="#ffffff" fill-opacity=".5"/>
      <circle cx="384" cy="258" r="5" fill="#ffffff" fill-opacity=".5"/>
      <circle cx="400" cy="258" r="5" fill="#008752"/>
      <text x="452" y="254" fill="#ffffff" fill-opacity=".62" font-family="Noto Kufi Arabic, sans-serif" font-size="11" text-anchor="middle">Factory B</text>
    </g>
    <g>
      <rect x="368" y="350" width="48" height="44" rx="9" fill="url(#gCard)" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5"/>
      <path d="M379 384v-16l10-6 10 6v16h-20Z" fill="#008752"/>
      <rect x="385" y="373" width="8" height="11" rx="1.5" fill="#001f5b" opacity=".5"/>
      <text x="452" y="376" fill="#ffffff" fill-opacity=".62" font-family="Noto Kufi Arabic, sans-serif" font-size="11" text-anchor="middle">Factory C</text>
    </g>
  </g>

  <!-- truck on the lower route -->
  <g transform="translate(150 336)">
    <path d="M0 0h40v16H0z" fill="#d91e36"/>
    <path d="M40 5h13l9 8v3H40V5Z" fill="#008752"/>
    <circle cx="12" cy="18" r="4.4" fill="#ffffff" fill-opacity=".88"/>
    <circle cx="52" cy="18" r="4.4" fill="#ffffff" fill-opacity=".88"/>
  </g>
</svg>